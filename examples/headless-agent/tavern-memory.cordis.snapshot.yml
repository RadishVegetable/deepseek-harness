# Keyless assembled Tavern Journey memory and compaction snapshot.
- id: storage
  name: '../../packages/storage/storage/src/index.ts'

- id: storage-json
  name: '../../packages/storage/storage-json/src/index.ts'
  config:
    root: './.tavern-storage'

- id: storage-domain
  name: '../../packages/storage/storage-domain/src/index.ts'
  config:
    backend: json

- id: tavern-host
  name: '../../packages/tavern/host/src/index.ts'
  config:
    cleaner:
      enabled: false
    memory:
      extraction:
        turnEnd: true
        midWindowTurns: 1
      compaction:
        chunkTurns: [1, 1]
        retainedTailTurns: 1
        checkpointBudgetTokens: 128
      edit:
        windowTurns: 1
        marginTurns: 0

- id: tavern-memory-llm
  name: './tests/fixtures/tavern-memory-llm.ts'

- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        disabled: true
      - id: compaction-basic
        name: '@deepseek-ai/dsh-compaction-basic'
        disabled: true
      - id: agent-spine
        name: '@deepseek-ai/dsh-agent-spine-demo'
        config:
          agents:
            - id: main
              provider: tavern-mock
              model: tavern-mock
              cwd: !!js process.cwd()
          workspaceContext: false
          skills:
            enabled: false
          toolBash: false
          toolJobs: false
          persona: 'Keyless Tavern Journey memory snapshot.'
      - id: persistence
        name: '@deepseek-ai/dsh-session-persistence-jsonl'
        config:
          root: './.sessions'
          compression: none

- id: tavern-memory-setup
  name: './tests/fixtures/tavern-memory-setup.ts'
