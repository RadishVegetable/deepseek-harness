# Optional overlay for `dsh web --patch packages/bundle/tavern/cordis.patch.yml`.
# The host bind is configurable for containers; the default is reachable from
# outside the container while the ordinary Web profile remains loopback-only.
- id: webserver
  inject: [webStartup]
  config:
    host: !!js ctx.webStartup.host ?? process.env.DSH_WEB_HOST ?? '0.0.0.0'
    port: !!js ctx.webStartup.port ?? Number(process.env.DSH_WEB_PORT ?? 3080)

# Tavern sessions use the dedicated roleplay preset. It is complete-prompt and
# intentionally contributes no coding tool rows.
- id: agent-presets
  config:
    default: tavern

- id: ui-layout
  disabled: true

- id: ui-sidebar
  disabled: true

- id: ui-conversation
  disabled: true

- id: ui-tavern
  disabled: true

# The Tavern root owns its own navigation, settings, transcript, and context
# tools. These generic browser occupants must stay disabled so no nested shell
# can win a slot or reintroduce the generic composer after a route change.
- id: ui-settings

- id: ui-settings-general
  disabled: true

- id: ui-settings-models
  disabled: true

- id: ui-settings-plugin-inventory
  disabled: true

- id: ui-tool
  disabled: true

- id: ui-cordis
  disabled: true

- id: ui-workflow-run
  disabled: true

- id: ui-deliverables
  disabled: true

- id: ui-workspace
  disabled: true

- id: ui-input-trigger
  disabled: true

- id: ui-commands
  disabled: true

- id: ui-skill
  disabled: true

- id: ui-subagent
  disabled: true

- id: ui-jobs
  disabled: true

- id: ui-goal
  disabled: true

- id: ui-message-feedback
  disabled: true

- id: ui-model-selection
  disabled: true

- id: ui-permission
  disabled: true

- id: ui-agent-preset
  disabled: true

- id: ui-settings-plugins
  disabled: true

- id: ui-plan
  disabled: true

- id: ui-user-questions
  disabled: true

- id: ui-trajectory
  disabled: true

- insert:
    - id: tavern-assets
      name: '@deepseek-ai/dsh-tavern-host'

    - id: ui-tavern-app
      name: '@deepseek-ai/dsh-client-ui-tavern-app'
